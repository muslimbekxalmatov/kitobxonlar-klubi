<div id="ai-widget" style="max-width:480px;margin:24px auto;padding:20px;
  border-radius:16px;background:#0f1226;color:#fff;font-family:sans-serif;
  box-shadow:0 4px 20px rgba(0,0,0,0.25);">
  <h3 style="margin:0 0 12px;font-size:18px;">📚 Kitob bo'yicha AI yordamchi</h3>
  <textarea id="ai-input" placeholder="Masalan: 'O'zbek adabiyotidan sarguzasht janrida 3 ta kitob tavsiya qil'"
    style="width:100%;min-height:70px;padding:10px;border-radius:10px;border:none;
    resize:vertical;font-size:14px;box-sizing:border-box;"></textarea>
  <button id="ai-send" style="margin-top:10px;padding:10px 18px;border:none;
    border-radius:10px;background:#4f6df5;color:#fff;font-weight:600;cursor:pointer;">
    Yuborish
  </button>
  <div id="ai-output" style="margin-top:14px;padding:12px;border-radius:10px;
    background:#1b1f3b;min-height:24px;font-size:14px;line-height:1.5;
    white-space:pre-wrap;"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-ai.js";

  // ⬇️⬇️⬇️ SHU YERGA O'ZINGIZNING firebaseConfig QIYMATLARINGIZNI QO'YING ⬇️⬇️⬇️
  const firebaseConfig = {
    apiKey: "BU_YERGA_API_KEY",
    authDomain: "BU_YERGA_AUTH_DOMAIN",
    projectId: "BU_YERGA_PROJECT_ID",
    storageBucket: "BU_YERGA_STORAGE_BUCKET",
    messagingSenderId: "BU_YERGA_SENDER_ID",
    appId: "BU_YERGA_APP_ID"
  };
  // ⬆️⬆️⬆️ ------------------------------------------------------ ⬆️⬆️⬆️

  const firebaseApp = initializeApp(firebaseConfig);
  const ai = getAI(firebaseApp, { backend: new GoogleAIBackend() });
  const model = getGenerativeModel(ai, { model: "gemini-2.5-flash" });

  const inputEl = document.getElementById("ai-input");
  const outputEl = document.getElementById("ai-output");
  const sendBtn = document.getElementById("ai-send");

  async function askAI() {
    const prompt = inputEl.value.trim();
    if (!prompt) return;

    sendBtn.disabled = true;
    sendBtn.textContent = "Yuklanmoqda...";
    outputEl.textContent = "";

    try {
      const fullPrompt =
        "Sen 'Kitobxonlar Klubi' veb-saytining kitob bo'yicha yordamchisisan. " +
        "O'zbek tilida, qisqa va foydali javob ber. Savol: " + prompt;

      const result = await model.generateContent(fullPrompt);
      outputEl.textContent = result.response.text();
    } catch (err) {
      outputEl.textContent = "❌ Xatolik yuz berdi: " + err.message;
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Yuborish";
    }
  }

  sendBtn.addEventListener("click", askAI);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      askAI();
    }
  });
</script>
