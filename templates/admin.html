<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kitobxonlar Clubi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #1c1c1e; color: #ffffff; padding: 20px; }
        .admin-wrapper { max-width: 900px; margin: 40px auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; background-color: #2c2c2e; padding: 20px 30px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #3a3a3c; }
        .admin-title { font-size: 20px; font-weight: 700; color: #30d158; }
        .btn-to-main { padding: 10px 16px; background-color: #3a3a3c; color: #ffffff; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .btn-to-main:hover { background-color: #48484a; }
        .messages-container { background-color: #2c2c2e; border-radius: 12px; padding: 25px; border: 1px solid #3a3a3c; }
        .section-title { font-size: 16px; font-weight: 600; color: #aeaeb2; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .msg-card { background-color: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        .msg-meta { display: flex; justify-content: space-between; font-size: 13px; color: #bfbfbf; border-bottom: 1px solid #2c2c2e; padding-bottom: 6px; }
        .user-name { font-weight: 600; color: #ff9f0a; }
        .msg-text { font-size: 15px; color: #ffffff; line-height: 1.4; padding-top: 4px; }
        .no-messages { text-align: center; color: #8e8e93; padding: 40px 0; font-size: 15px; }
        
        /* Admin javob yozish oynasi stili */
        .reply-section { margin-top: 15px; display: flex; gap: 10px; }
        .reply-input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #3a3a3c; background-color: #2c2c2e; color: white; outline: none; }
        .btn-reply { padding: 10px 16px; background-color: #30d158; color: black; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <div class="admin-header">
            <div class="admin-title">👨‍💻 Kitobxonlar Clubi | Admin Panel</div>
            <a href="main.html" class="btn-to-main">Asosiy sahifaga o'tish</a>
        </div>
        <div class="messages-container">
            <div class="section-title">📥 Kelgan shaxsiy xabarlar</div>
            <div id="messagesList">
                <div class="no-messages" id="noMsgText">Hozircha yangi shaxsiy xabarlar yo'q.</div>
            </div>
        </div>
    </div>
    <script>
        window.onload = function() {
            var messagesList = document.getElementById("messagesList");
            var noMsgText = document.getElementById("noMsgText");
            var savedMessages = JSON.parse(localStorage.getItem("private_messages")) || [];
            
            if (savedMessages.length > 0) {
                noMsgText.style.display = "none";
                savedMessages.forEach(function(item, index) {
                    var card = document.createElement("div");
                    card.className = "msg-card";
                    card.innerHTML = `
                        <div class="msg-meta">
                            <span class="user-name">👤 Foydalanuvchi: ${item.sender}</span>
                            <span>📅 ${item.time}</span>
                        </div>
                        <div class="msg-text">${item.message}</div>
                        
                        <!-- SIZ UCHUN JAVOB YOZISH INTERFEYSI 🚀 -->
                        <div class="reply-section">
                            <input type="text" id="replyInp_${index}" class="reply-input" placeholder="Foydalanuvchiga sayt ichida javob yozing...">
                            <button class="btn-reply" onclick="submitReply(${index})">Javob berish</button>
                        </div>
                    `;
                    messagesList.appendChild(card);
                });
            }
        };

        // JAVOB BERISH BOSILGANDA QIZIL BELGINI YOQUVCHI FUNKSIYA
        function submitReply(index) {
            var text = document.getElementById("replyInp_" + index).value;
            if(text.trim() === "") {
                alert("Iltimos, javob matnini yozing!");
                return;
            }

            // Sayt xotirasiga javobni yozamiz va "Yangi javob bor" belgisini yoqamiz
            localStorage.setItem("admin_last_reply_text", text);
            localStorage.setItem("admin_has_replied", "true"); // Bosh sahifada QIZIL BELGI yonadi 🔴

            alert("Javobingiz muvaffaqiyatli saqlandi! Foydalanuvchi bosh sahifaga kirishi bilan uning ekranida QIZIL BELGI lip-lip o'chib-yonadi! 🔴");
            document.getElementById("replyInp_" + index).value = "";
        }
    </script>
</body>
</html>
